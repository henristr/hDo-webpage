[build]
  command = """
    npm run build && \
    git clone https://github.com/henristr/hDo.git /tmp/rn-app && \
    cd /tmp/rn-app && npm install && npx expo export --platform web --output-dir /opt/build/repo/dist/web
  """
  publish = "dist"

[[redirects]]
  from = "/web/*"
  to = "/web/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200